body:before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(ellipse 40% 22% at 0% 22%,#d9ecd0aa,transparent),radial-gradient(ellipse 40% 26% at 100% 60%,#ffd9de99,transparent),radial-gradient(ellipse 45% 22% at 0% 88%,#d9ecd088,transparent),
repeating-linear-gradient(90deg,#fff 0 7px,#fdf1f3 7px 8px)}
.wrap{max-width:520px;margin:0 auto;padding:0 12px 120px}
.ad{font-family:Adderley,Museo,sans-serif;font-weight:700;text-transform:uppercase;line-height:.9}
html[lang=kk] .ad{font-family:Museo,sans-serif;font-weight:900;line-height:1}
.sc{font-family:KZSP,cursive;font-weight:400;line-height:1;color:var(--deep)}
.hatch{background:repeating-linear-gradient(135deg,#a8122e 0 3px,#c24560 3px 5px);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:flex-end;padding:12px 0 0;position:relative;z-index:5}
.lang{display:flex;background:#fff;border-radius:99px;padding:3px;box-shadow:0 2px 10px #a8122e22}
.lang button{border:0;background:none;font:700 12px Museo,sans-serif;padding:6px 12px;border-radius:99px;color:var(--red);cursor:pointer}
.lang button.on{background:var(--red);color:#fff}
/* giant title behind card */
.giant{height:118px;overflow:hidden;margin:-6px -4px 0;text-align:center;font-size:min(27vw,140px);line-height:1;background:linear-gradient(#a8122e 20%,#c8566b 90%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;z-index:1;letter-spacing:-.01em}
.card{position:relative;z-index:2;border-radius:30px;background:linear-gradient(#fbfdf9,#f3f9ef 60%,#e9f4e1);box-shadow:0 20px 40px #a8122e1c,inset 0 0 0 1px #fff;min-height:610px;padding:40px 18px 0;overflow:visible;margin-top:10px}

.kick{font-size:10px;letter-spacing:.3em;color:#8a8f98;font-weight:700;position:relative}
.card .sc{font-size:38px;color:var(--red);margin-top:12px;position:relative;transform:rotate(-3deg);transform-origin:left}
.card h1{font-size:62px;line-height:.88;position:relative;margin-top:-2px;letter-spacing:-.005em}
html[lang=kk] .card h1{font-size:40px;line-height:1}
.stk{position:relative;display:inline-block;background:var(--pink);color:#2b1a1e;font:700 17px Museo;border-radius:8px;padding:7px 14px;transform:rotate(-4deg);margin-top:-6px;margin-left:30px;box-shadow:0 4px 10px #a8122e22;z-index:3}
.stk:after{content:"";position:absolute;right:-9px;top:-9px;width:14px;height:14px;border-top:3px solid var(--red);border-right:3px solid var(--red);transform:rotate(-45deg) scale(.7);opacity:.7}
.lead{position:relative;font-size:12.5px;line-height:1.45;color:#4a4a52;text-align:center;width:52%;margin:16px 0 0;z-index:3}
.lead b{font-weight:900;color:#1f1f24}
.photo{position:absolute;right:-14px;bottom:0;height:62%;z-index:2;filter:drop-shadow(0 8px 14px #0002)}
.prof{position:relative;z-index:4;margin-top:14px;display:flex;align-items:center;gap:10px;width:64%;background:#fffffff0;border-radius:16px;padding:8px 10px;box-shadow:0 8px 20px #0000001a;text-decoration:none;color:#111}
.ring{flex:none;width:52px;height:52px;border-radius:50%;padding:2.5px;background:conic-gradient(#f58529,#dd2a7b,#8134af,#f58529)}
.ring img{width:100%;height:100%;border-radius:50%;border:2px solid #fff;object-fit:cover;object-position:50% 18%;background:var(--pink);display:block}
.prof b{display:block;font-size:12.5px;font-weight:900}
.st{display:flex;gap:10px;font-style:normal;font-size:10.5px;margin-top:4px;color:#222}.st u{text-decoration:none;color:#666;display:block;font-size:9.5px}.st strong{font-weight:900;font-size:12px;display:block}.prof small{display:block;font-size:10px;color:#666;margin-top:2px;line-height:1.3}
.glass{position:relative;z-index:4;display:block;margin-top:14px;width:60%;padding:7px;border-radius:18px;background:#ffffff88;box-shadow:0 0 0 1px #ffffffcc,0 12px 30px #8fd3d155;text-decoration:none}
.glass span{display:block;text-align:center;border-radius:10px;padding:15px 8px;color:#fff;font:900 13px Museo;text-transform:uppercase;letter-spacing:.05em;background:linear-gradient(#a9e0de,#74c5c2);box-shadow:0 8px 14px #5cb8b577,inset 0 1px 0 #fff8;text-shadow:0 1px 3px #0003}
.glass b{font-weight:900;display:block}.glass i{display:block;font:500 9px Museo;letter-spacing:.14em;margin-top:3px;opacity:.95;font-style:normal;text-transform:uppercase}
.nav{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-around;padding:0 18% 0 8%;z-index:3;opacity:.75;pointer-events:none}
.nav svg{width:22px;height:22px;fill:var(--red)}.nav svg:nth-child(n+3){opacity:.35}
.ui{position:absolute;right:26px;top:84px;display:flex;gap:14px;z-index:3}.ui svg{width:22px;height:22px;fill:var(--red)}
/* bubbles */
.bub{position:absolute;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;color:#fff;background:var(--b1) center/100% 100% no-repeat;width:92px;height:76px;padding:0 4px 12px 6px;font-size:16px;z-index:5;animation:fl 4s ease-in-out infinite}
.bub svg{width:22px;height:22px;fill:#fff}
.bub.p{background-image:var(--b2);color:var(--red)}.bub.p svg{fill:var(--red)}
.bub.d{background-image:var(--b3)}
.bub.s{width:50px;height:42px;font-size:10px;padding:0 2px 6px 3px;gap:2px}.bub.s svg{width:12px;height:12px}
@keyframes fl{50%{translate:0 -8px}}
.hb1{left:-12px;top:-22px;transform:rotate(-12deg)}.hb2{right:-12px;top:150px;transform:rotate(9deg);animation-delay:-1.3s;width:84px;height:70px}
.hb3{right:22px;top:8px;transform:rotate(8deg);animation-delay:-.6s}.hb4{left:14px;bottom:128px;transform:rotate(-10deg);animation-delay:-2s}
/* sections */
.head{text-align:center;margin:44px 0 22px;position:relative}
.head .sc{font-size:36px;color:var(--deep);transform:rotate(-3deg);margin-bottom:-6px;position:relative;z-index:2}
.head h2{font-size:58px;letter-spacing:-.005em}
html[lang=kk] .head h2{font-size:36px;margin-top:8px}
.tk{position:relative;overflow:hidden;border-radius:22px;margin:0 0 20px;padding:12px;background:var(--pink)}
.tk.r{background:var(--red)}
.stub{padding:10px 10px 22px;text-align:center;font-size:13px;line-height:1.5;color:var(--red);position:relative}
.tk.r .stub{color:#fff}
.stub b{font-weight:900}
.stub .sc{display:block;font-size:30px;color:inherit;margin-bottom:8px;transform:rotate(-2deg)}
.cut{position:relative;height:0;border-top:3px dashed #ffffffaa;margin:0 -12px}
.cut:before,.cut:after{content:"";position:absolute;top:-16px;width:30px;height:30px;border-radius:50%;background:#fff}
.cut:before{left:-15px}.cut:after{right:-15px}
.main{background:#fff;border-radius:16px;padding:20px 18px 16px;margin-top:12px;position:relative;box-shadow:0 2px 0 #0000000a}
.main h3{font:900 24px Museo;color:var(--red);text-transform:uppercase;margin-bottom:12px;letter-spacing:.01em}
.main ul{list-style:none;display:grid;gap:9px;font-size:13.5px;line-height:1.4;color:#33333a}

.price{margin:18px 0 12px;font-weight:900;font-size:36px;color:#1e1e22;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.price small{font-size:12px;opacity:.55;font-weight:700}
.tg{display:inline-block;width:.6em;height:.76em;vertical-align:-.04em;margin-left:.1em}
.tk .glass{width:100%;margin-top:0}
.tk .bub{width:62px;height:52px;font-size:11px;padding:0 2px 8px 3px;right:16px;top:-6px;transform:rotate(10deg)}
.tk .bub svg{width:14px;height:14px}
.tk .bub.q{right:auto;left:10px;top:auto;bottom:22px;transform:rotate(-12deg);width:48px;height:40px}
.ct{background:var(--red);color:#fff;border-radius:26px;padding:26px 16px 22px;text-align:center;box-shadow:0 14px 30px #a8122e44}
.ct .sc{font-size:34px;color:#fff}
.ct h3{font-size:44px;margin:4px 0 16px}
html[lang=kk] .ct h3{font-size:28px}
.ct .glass{width:100%;margin-top:12px;background:#ffffff33}
.foot{text-align:center;font-size:12px;opacity:.5;margin-top:22px;font-weight:700;letter-spacing:.14em}
.nb{position:fixed;z-index:20;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 20px),500px);display:flex;align-items:center;gap:10px;background:#2b2024ee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:18px;padding:10px 12px 10px 10px;box-shadow:0 12px 30px #0006;animation:up .6s .8s both}
@keyframes up{from{opacity:0;transform:translate(-50%,30px)}}
.nb img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;background:var(--pink)}
.nb p{flex:1;font-weight:900;font-size:12.5px;line-height:1.25}
.nb a{background:#fff;color:#111;text-decoration:none;font:900 12px Museo;border-radius:99px;padding:10px 14px;white-space:nowrap}
.nb button{position:absolute;top:-9px;right:-3px;width:22px;height:22px;border-radius:50%;border:0;background:#fff;color:#111;font:900 13px/22px Museo;cursor:pointer;box-shadow:0 2px 6px #0004}
.nb.x{display:none}
</style>
</head>
